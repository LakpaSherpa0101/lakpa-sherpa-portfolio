<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing background neural circles -->
  <circle cx="300" cy="300" r="240" fill="url(#heroGrad)" opacity="0.14" filter="url(#glow)"/>
  <circle cx="300" cy="300" r="195" fill="none" stroke="url(#heroGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="300" cy="300" r="160" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" opacity="0.95"/>

  <!-- Neural Network Nodes in Background -->
  <g opacity="0.4">
    <!-- Lines -->
    <line x1="200" y1="180" x2="260" y2="230" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="400" y1="180" x2="340" y2="230" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="160" y1="280" x2="220" y2="340" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="440" y1="280" x2="380" y2="340" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Nodes -->
    <circle cx="200" cy="180" r="5" fill="#818cf8"/>
    <circle cx="400" cy="180" r="5" fill="#38bdf8"/>
    <circle cx="160" cy="280" r="5" fill="#c084fc"/>
    <circle cx="440" cy="280" r="5" fill="#34d399"/>
    <circle cx="260" cy="230" r="4" fill="#a5b4fc"/>
    <circle cx="340" cy="230" r="4" fill="#7dd3fc"/>
  </g>

  <!-- Developer Silhouette / Character -->
  <!-- Body / Hoodie -->
  <path d="M 200 480 C 200 390, 240 370, 300 370 C 360 370, 400 390, 400 480 Z" fill="#3b82f6"/>
  <path d="M 230 480 C 240 410, 270 380, 300 380 C 330 380, 360 410, 370 480 Z" fill="#1d4ed8"/>
  <polygon points="280,380 320,380 300,430" fill="#60a5fa" opacity="0.5"/>

  <!-- Neck & Face -->
  <rect x="280" y="325" width="40" height="40" rx="6" fill="#fed7aa"/>
  <ellipse cx="300" cy="285" rx="52" ry="62" fill="#fed7aa"/>
  
  <!-- Hair -->
  <path d="M 245 270 C 245 220, 355 220, 355 270 C 335 250, 265 250, 245 270 Z" fill="#1e293b"/>
  <path d="M 248 250 Q 300 190 352 250 Q 370 235 345 210 Q 300 180 255 210 Z" fill="#0f172a"/>

  <!-- Glasses -->
  <rect x="265" y="270" width="30" height="20" rx="5" fill="none" stroke="#0284c7" stroke-width="3"/>
  <rect x="305" y="270" width="30" height="20" rx="5" fill="none" stroke="#0284c7" stroke-width="3"/>
  <line x1="295" y1="280" x2="305" y2="280" stroke="#0284c7" stroke-width="3"/>
  <!-- Smile -->
  <path d="M 288 315 Q 300 325 312 315" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Laptop -->
  <rect x="210" y="420" width="180" height="110" rx="8" fill="url(#laptopGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="220" y="430" width="160" height="90" rx="4" fill="#090d16"/>
  <!-- AI Code & Neural model on Laptop Screen -->
  <rect x="230" y="442" width="70" height="4" rx="2" fill="#38bdf8"/>
  <rect x="230" y="452" width="100" height="4" rx="2" fill="#a855f7"/>
  <rect x="240" y="462" width="60" height="4" rx="2" fill="#22c55e"/>
  <rect x="240" y="472" width="90" height="4" rx="2" fill="#f59e0b"/>
  <rect x="230" y="482" width="50" height="4" rx="2" fill="#38bdf8"/>
  
  <!-- Mini Neural graph on screen -->
  <circle cx="350" cy="460" r="4" fill="#6366f1"/>
  <circle cx="365" cy="450" r="3" fill="#a855f7"/>
  <circle cx="365" cy="470" r="3" fill="#38bdf8"/>
  <line x1="350" y1="460" x2="365" y2="450" stroke="#6366f1" stroke-width="1"/>
  <line x1="350" y1="460" x2="365" y2="470" stroke="#6366f1" stroke-width="1"/>

  <!-- Laptop base -->
  <path d="M 170 530 L 430 530 L 410 545 L 190 545 Z" fill="#64748b"/>
  <rect x="270" y="533" width="60" height="4" rx="2" fill="#94a3b8"/>

  <!-- AI ENGINEER FLOATING BADGES -->
  <!-- Badge 1: Python -->
  <g transform="translate(65, 150)">
    <rect width="125" height="46" rx="23" fill="#111827" stroke="#38bdf8" stroke-width="1.8" filter="url(#glow)"/>
    <circle cx="23" cy="23" r="13" fill="#0284c7"/>
    <text x="23" y="27" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">py</text>
    <text x="45" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Python</text>
  </g>

  <!-- Badge 2: PyTorch / Deep Learning -->
  <g transform="translate(390, 160)">
    <rect width="145" height="46" rx="23" fill="#111827" stroke="#ef4444" stroke-width="1.8" filter="url(#glow)"/>
    <circle cx="23" cy="23" r="13" fill="#dc2626"/>
    <text x="23" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">🔥</text>
    <text x="45" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">PyTorch / DL</text>
  </g>

  <!-- Badge 3: LLMs & AI Agents -->
  <g transform="translate(395, 375)">
    <rect width="145" height="46" rx="23" fill="#111827" stroke="#a855f7" stroke-width="1.8" filter="url(#glow)"/>
    <circle cx="23" cy="23" r="13" fill="#9333ea"/>
    <text x="23" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#fff" text-anchor="middle">🤖</text>
    <text x="45" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">LLMs &amp; Agents</text>
  </g>

  <!-- Badge 4: Machine Learning & AWS -->
  <g transform="translate(50, 365)">
    <rect width="140" height="46" rx="23" fill="#111827" stroke="#10b981" stroke-width="1.8" filter="url(#glow)"/>
    <circle cx="23" cy="23" r="13" fill="#059669"/>
    <text x="23" y="28" font-family="system-ui, sans-serif" font-size="12" fill="#fff" text-anchor="middle">⚡</text>
    <text x="45" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">AI &amp; Backend</text>
  </g>
</svg>
