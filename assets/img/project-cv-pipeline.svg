<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0f2b38" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#cvBg)"/>

  <!-- App Window -->
  <rect x="30" y="24" width="540" height="352" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>
  <rect x="30" y="24" width="540" height="36" rx="12" fill="#1e293b"/>
  <circle cx="50" cy="42" r="5" fill="#ef4444"/>
  <circle cx="68" cy="42" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="42" r="5" fill="#10b981"/>
  <rect x="110" y="32" width="260" height="20" rx="6" fill="#070a13" opacity="0.8"/>
  <text x="124" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">http://localhost:8501/vision-stream</text>
  <rect x="420" y="32" width="135" height="20" rx="6" fill="#06b6d4" opacity="0.15"/>
  <text x="487" y="46" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#22d3ee" text-anchor="middle">FPS: 48.5 | Latency: 21ms</text>

  <!-- Video Stream Window -->
  <g transform="translate(50, 75)">
    <rect x="0" y="0" width="340" height="240" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    
    <!-- Target Bounding Box 1 -->
    <rect x="40" y="50" width="110" height="130" rx="4" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="40" y="32" width="95" height="18" rx="3" fill="#0891b2"/>
    <text x="45" y="45" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#fff">Person: 98.4%</text>

    <!-- Target Bounding Box 2 -->
    <rect x="180" y="80" width="130" height="110" rx="4" fill="none" stroke="#a855f7" stroke-width="2"/>
    <rect x="180" y="62" width="95" height="18" rx="3" fill="#9333ea"/>
    <text x="185" y="75" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#fff">Vehicle: 96.1%</text>

    <!-- Center Crosshair -->
    <circle cx="170" cy="120" r="15" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
    <line x1="170" y1="100" x2="170" y2="140" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <line x1="150" y1="120" x2="190" y2="120" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>

    <!-- Status overlay -->
    <rect x="10" y="206" width="320" height="24" rx="4" fill="#0f172a" opacity="0.85"/>
    <text x="20" y="222" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4ade80">● Model: YOLOv8 / PyTorch | TensorRT Optimized</text>
  </g>

  <!-- Right Diagnostics Column -->
  <g transform="translate(405, 75)">
    <rect x="0" y="0" width="150" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Inference Time</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#22d3ee">14.2 ms</text>
    <text x="12" y="60" font-family="system-ui, sans-serif" font-size="9" fill="#4ade80">GPU Accelerated</text>

    <rect x="0" y="80" width="150" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="100" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Detected Objects</text>
    <text x="12" y="124" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#a855f7">12 Tracked</text>
    <text x="12" y="140" font-family="system-ui, sans-serif" font-size="9" fill="#38bdf8">Multi-Class Output</text>

    <rect x="0" y="160" width="150" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="180" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Confidence Threshold</text>
    <text x="12" y="204" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#10b981">0.85</text>
    <text x="12" y="220" font-family="system-ui, sans-serif" font-size="9" fill="#cbd5e1">IoU NMS: 0.45</text>
  </g>

  <!-- Bottom Tech Bar -->
  <g transform="translate(50, 328)">
    <rect x="0" y="0" width="60" height="22" rx="4" fill="#1e293b"/>
    <text x="30" y="15" font-family="monospace" font-size="9" fill="#93c5fd" text-anchor="middle">Python</text>

    <rect x="68" y="0" width="60" height="22" rx="4" fill="#1e293b"/>
    <text x="98" y="15" font-family="monospace" font-size="9" fill="#f87171" text-anchor="middle">PyTorch</text>

    <rect x="136" y="0" width="65" height="22" rx="4" fill="#1e293b"/>
    <text x="168" y="15" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle">OpenCV</text>

    <rect x="208" y="0" width="60" height="22" rx="4" fill="#1e293b"/>
    <text x="238" y="15" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Docker</text>

    <rect x="276" y="0" width="65" height="22" rx="4" fill="#1e293b"/>
    <text x="308" y="15" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">FastAPI</text>
  </g>
</svg>
