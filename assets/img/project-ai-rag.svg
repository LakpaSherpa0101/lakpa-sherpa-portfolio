<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="url(#ragBg)"/>

  <!-- App Window -->
  <rect x="30" y="24" width="540" height="352" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="30" y="24" width="540" height="36" rx="12" fill="#1e293b"/>
  <circle cx="50" cy="42" r="5" fill="#ef4444"/>
  <circle cx="68" cy="42" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="42" r="5" fill="#10b981"/>
  <rect x="110" y="32" width="240" height="20" rx="6" fill="#0b0f19" opacity="0.8"/>
  <text x="124" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">https://rag-assistant.ai/chat</text>
  <rect x="430" y="32" width="125" height="20" rx="6" fill="#8b5cf6" opacity="0.2"/>
  <text x="492" y="46" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#c084fc" text-anchor="middle">⚡ RAG Pipeline Active</text>

  <!-- App Header -->
  <rect x="30" y="60" width="540" height="44" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <circle cx="56" cy="82" r="12" fill="#8b5cf6"/>
  <text x="56" y="86" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">AI</text>
  <text x="78" y="86" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Document Intelligence &amp; RAG Assistant</text>

  <!-- Left Sidebar: Vector Index & Documents -->
  <rect x="30" y="104" width="150" height="272" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <text x="46" y="130" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#cbd5e1">INDEXED DOCUMENTS</text>
  
  <rect x="42" y="142" width="126" height="26" rx="5" fill="#1e293b"/>
  <text x="52" y="158" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd">📄 Research_Paper.pdf</text>
  
  <rect x="42" y="174" width="126" height="26" rx="5" fill="#1e293b"/>
  <text x="52" y="190" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">📊 Financial_Report.csv</text>

  <rect x="42" y="206" width="126" height="26" rx="5" fill="#1e293b"/>
  <text x="52" y="222" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">📑 API_Technical_Doc.md</text>

  <!-- Vector Store Status -->
  <rect x="42" y="290" width="126" height="70" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="52" y="308" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#a5b4fc">VECTOR DATABASE</text>
  <text x="52" y="324" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e2e8f0">Embeddings: 1536-dim</text>
  <text x="52" y="340" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4ade80">Similarity: Cosine</text>

  <!-- Main Chat / Query Flow -->
  <g transform="translate(196, 120)">
    <!-- User Prompt Bubble -->
    <rect x="120" y="0" width="234" height="42" rx="10" fill="#3b82f6"/>
    <text x="132" y="18" font-family="system-ui, sans-serif" font-size="10" fill="#fff">What are the primary findings in section 3</text>
    <text x="132" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#fff">of the indexed research paper?</text>

    <!-- Context Retrieval Step -->
    <rect x="10" y="52" width="344" height="34" rx="6" fill="#1e293b" stroke="#4f46e5" stroke-dasharray="3 3"/>
    <circle cx="26" cy="69" r="6" fill="#8b5cf6"/>
    <text x="40" y="73" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a5b4fc">Retrieving Top-K relevant chunks via Vector Embeddings...</text>

    <!-- AI Response Bubble -->
    <rect x="10" y="96" width="344" height="100" rx="10" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
    <circle cx="28" cy="116" r="10" fill="#8b5cf6"/>
    <text x="28" y="120" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">AI</text>
    <text x="48" y="118" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c084fc">RAG Assistant Response:</text>
    
    <text x="26" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">According to chunk #4 &amp; #7, the proposed model achieved:</text>
    <text x="36" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd">• 94.2% accuracy on benchmark test sets</text>
    <text x="36" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd">• 3.5x reduction in inference latency using quantised weights</text>
    <text x="26" y="186" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Source: Research_Paper.pdf (Pages 12-14)</text>

    <!-- Prompt Input box -->
    <rect x="10" y="210" width="290" height="32" rx="8" fill="#1e293b" stroke="#374151" stroke-width="1"/>
    <text x="24" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Ask questions about your documents...</text>
    <rect x="306" y="210" width="48" height="32" rx="8" fill="#8b5cf6"/>
    <text x="330" y="230" font-family="system-ui, sans-serif" font-size="12" fill="#fff" text-anchor="middle">➤</text>
  </g>
</svg>
