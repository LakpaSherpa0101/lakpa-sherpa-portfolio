<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="smsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Container / Background -->
  <rect width="600" height="400" rx="16" fill="url(#smsBg)"/>

  <!-- Browser Frame -->
  <rect x="30" y="24" width="540" height="352" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Browser Header -->
  <rect x="30" y="24" width="540" height="36" rx="12" fill="#1e293b"/>
  <!-- Window Controls -->
  <circle cx="50" cy="42" r="5" fill="#ef4444"/>
  <circle cx="68" cy="42" r="5" fill="#f59e0b"/>
  <circle cx="86" cy="42" r="5" fill="#10b981"/>
  <!-- Address Bar -->
  <rect x="110" y="32" width="280" height="20" rx="6" fill="#0f172a" opacity="0.8"/>
  <text x="124" y="46" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">http://localhost:5000/admin/dashboard</text>
  <!-- Role badge -->
  <rect x="440" y="32" width="115" height="20" rx="6" fill="#22c55e" opacity="0.15"/>
  <text x="497" y="46" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4ade80" text-anchor="middle">Role: Administrator</text>

  <!-- App Header / Navbar -->
  <rect x="30" y="60" width="540" height="44" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <circle cx="56" cy="82" r="12" fill="#6366f1"/>
  <text x="56" y="86" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">SMS</text>
  <text x="78" y="86" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Student Management System</text>
  <!-- Search Input Bar -->
  <rect x="320" y="70" width="160" height="24" rx="12" fill="#1e293b" stroke="#374151" stroke-width="1"/>
  <text x="335" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">🔍 Search students by ID, name...</text>
  <rect x="490" y="70" width="65" height="24" rx="6" fill="#3b82f6"/>
  <text x="522" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">+ Add</text>

  <!-- Left Sidebar Navigation -->
  <rect x="30" y="104" width="120" height="272" fill="#0f172a" stroke="#1f2937" stroke-width="1"/>
  <!-- Nav item 1 (Active) -->
  <rect x="38" y="118" width="104" height="26" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="50" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#818cf8">📊 Dashboard</text>
  <!-- Nav items -->
  <text x="50" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">🎓 Students List</text>
  <text x="50" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">📝 Registration</text>
  <text x="50" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">📚 Courses &amp; Marks</text>
  <text x="50" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">🗄️ Database Logs</text>
  <text x="50" y="285" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">⚙️ Settings</text>

  <!-- Database status indicator at bottom of sidebar -->
  <rect x="38" y="338" width="104" height="24" rx="4" fill="#111827"/>
  <circle cx="50" cy="350" r="4" fill="#22c55e"/>
  <text x="60" y="353" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">MySQL: Connected</text>

  <!-- Main Content Area -->
  <!-- Stats Row -->
  <g transform="translate(162, 114)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="90" height="46" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="10" y="16" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Total Students</text>
    <text x="10" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">1,248</text>

    <!-- Metric 2 -->
    <rect x="98" y="0" width="90" height="46" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="108" y="16" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Active Courses</text>
    <text x="108" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">36</text>

    <!-- Metric 3 -->
    <rect x="196" y="0" width="90" height="46" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="206" y="16" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Departments</text>
    <text x="206" y="36" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#a855f7">8</text>

    <!-- Metric 4 -->
    <rect x="294" y="0" width="100" height="46" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="304" y="16" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Database Status</text>
    <text x="304" y="36" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4ade80">Synchronized</text>
  </g>

  <!-- Student Records Table -->
  <g transform="translate(162, 170)">
    <!-- Table Container -->
    <rect x="0" y="0" width="394" height="194" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="394" height="26" rx="8" fill="#1e293b"/>
    <text x="12" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#cbd5e1">STUDENT ID</text>
    <text x="82" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#cbd5e1">FULL NAME</text>
    <text x="182" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#cbd5e1">PROGRAM / DEPT</text>
    <text x="282" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#cbd5e1">ACADEMIC STATUS</text>
    <text x="358" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#cbd5e1">ACTIONS</text>

    <!-- Row 1 -->
    <line x1="0" y1="56" x2="394" y2="56" stroke="#1f2937" stroke-width="1"/>
    <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">#STU-2024-01</text>
    <circle cx="90" cy="41" r="7" fill="#6366f1"/>
    <text x="103" y="44" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#f8fafc">Aarav Sharma</text>
    <text x="182" y="44" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">BSc CS &amp; AI (Yr 3)</text>
    <rect x="282" y="34" width="56" height="15" rx="3" fill="#22c55e" opacity="0.15"/>
    <text x="310" y="45" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#4ade80" text-anchor="middle">Enrolled</text>
    <text x="360" y="45" font-family="system-ui, sans-serif" font-size="10" fill="#60a5fa">✏️ 🗑️</text>

    <!-- Row 2 -->
    <line x1="0" y1="88" x2="394" y2="88" stroke="#1f2937" stroke-width="1"/>
    <text x="12" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">#STU-2024-02</text>
    <circle cx="90" cy="71" r="7" fill="#ec4899"/>
    <text x="103" y="74" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#f8fafc">Pooja Thapa</text>
    <text x="182" y="74" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">BSc Computing</text>
    <rect x="282" y="64" width="56" height="15" rx="3" fill="#22c55e" opacity="0.15"/>
    <text x="310" y="75" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#4ade80" text-anchor="middle">Enrolled</text>
    <text x="360" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#60a5fa">✏️ 🗑️</text>

    <!-- Row 3 -->
    <line x1="0" y1="120" x2="394" y2="120" stroke="#1f2937" stroke-width="1"/>
    <text x="12" y="104" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">#STU-2024-03</text>
    <circle cx="90" cy="101" r="7" fill="#f59e0b"/>
    <text x="103" y="104" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#f8fafc">Rohan Adhikari</text>
    <text x="182" y="104" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">BSc Data Science</text>
    <rect x="282" y="94" width="56" height="15" rx="3" fill="#38bdf8" opacity="0.15"/>
    <text x="310" y="105" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#38bdf8" text-anchor="middle">Graduating</text>
    <text x="360" y="105" font-family="system-ui, sans-serif" font-size="10" fill="#60a5fa">✏️ 🗑️</text>

    <!-- Row 4 -->
    <line x1="0" y1="152" x2="394" y2="152" stroke="#1f2937" stroke-width="1"/>
    <text x="12" y="136" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">#STU-2024-04</text>
    <circle cx="90" cy="133" r="7" fill="#10b981"/>
    <text x="103" y="136" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#f8fafc">Sneha Gurung</text>
    <text x="182" y="136" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">BSc CS &amp; AI (Yr 2)</text>
    <rect x="282" y="126" width="56" height="15" rx="3" fill="#22c55e" opacity="0.15"/>
    <text x="310" y="137" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#4ade80" text-anchor="middle">Enrolled</text>
    <text x="360" y="137" font-family="system-ui, sans-serif" font-size="10" fill="#60a5fa">✏️ 🗑️</text>

    <!-- Tech Badges Bar -->
    <g transform="translate(10, 166)">
      <rect x="0" y="0" width="56" height="18" rx="4" fill="#374151"/>
      <text x="28" y="12" font-family="monospace" font-size="9" fill="#93c5fd" text-anchor="middle">Python</text>
      <rect x="62" y="0" width="50" height="18" rx="4" fill="#374151"/>
      <text x="87" y="12" font-family="monospace" font-size="9" fill="#cbd5e1" text-anchor="middle">Flask</text>
      <rect x="118" y="0" width="54" height="18" rx="4" fill="#374151"/>
      <text x="145" y="12" font-family="monospace" font-size="9" fill="#fdba74" text-anchor="middle">MySQL</text>
      <rect x="178" y="0" width="52" height="18" rx="4" fill="#374151"/>
      <text x="204" y="12" font-family="monospace" font-size="9" fill="#86efac" text-anchor="middle">REST API</text>
    </g>
  </g>
</svg>
